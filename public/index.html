<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector de comprobantes</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" }</script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<main class="max-w-5xl mx-auto px-4 py-8">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold">Lector de comprobantes de pago</h1>
    <input id="key" type="password" placeholder="API key" autocomplete="off"
      class="w-64 rounded-lg border border-slate-700 bg-slate-900 px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
  </div>

  <label id="drop" class="block cursor-pointer rounded-xl border-2 border-dashed border-slate-700 bg-slate-900 p-8 text-center text-slate-400 transition hover:border-indigo-500">
    Arrastra imágenes aquí, pega (Ctrl+V) o haz clic para elegir. JPG, PNG o WEBP; puedes subir varias.
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  </label>

  <div id="items" class="mt-6 grid gap-4"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const drop = $("#drop"), input = $("#file"), items = $("#items"), keyEl = $("#key");
const OVER = ["border-indigo-500", "text-slate-200"];

keyEl.value = localStorage.getItem("apiKey") ?? "";
keyEl.oninput = () => localStorage.setItem("apiKey", keyEl.value);

input.onchange = () => { enviarTodos([...input.files]); input.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add(...OVER); };
drop.ondragleave = () => drop.classList.remove(...OVER);
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove(...OVER); enviarTodos([...e.dataTransfer.files]); };
document.onpaste = (e) => enviarTodos([...e.clipboardData.files]);

// Las peticiones van en paralelo moderado; el servidor las encola
async function enviarTodos(files) {
  const cola = [...files];
  await Promise.all(Array.from({ length: 3 }, async () => { for (let f; (f = cola.shift()); ) await enviar(f); }));
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const badge = (cls, txt) => `<span class="rounded-full px-3 py-0.5 text-sm font-semibold ${cls}">${txt}</span>`;
const OK = "bg-emerald-500/15 text-emerald-400", NO = "bg-red-500/15 text-red-400", WAIT = "bg-indigo-500/15 text-indigo-400", LLM = "bg-amber-500/15 text-amber-400";

async function enviar(file) {
  const el = document.createElement("div");
  el.className = "grid gap-4 rounded-xl border border-slate-800 bg-slate-900 p-4 sm:grid-cols-[220px_1fr]";
  el.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="" class="max-h-96 w-full rounded-lg bg-black object-contain">
    <div>${badge(WAIT, "Analizando…")} <span class="ml-2 text-sm text-slate-500">${esc(file.name)}</span></div>`;
  items.prepend(el);
  const panel = el.lastElementChild;

  try {
    const r = await fetch("/api/analizar", {
      method: "POST",
      headers: { "Content-Type": file.type, "x-api-key": keyEl.value },
      body: file,
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error ?? r.statusText);
    panel.innerHTML = render(d, file.name, ` · ${r.headers.get("X-Time-Ms")} ms · ${r.headers.get("X-Model")}`);
    panel.querySelector("[data-copy]").onclick = () => navigator.clipboard.writeText(JSON.stringify(d, null, 2));
  } catch (e) {
    panel.innerHTML = `${badge(NO, "Error")} <span class="ml-2 text-sm text-slate-500">${esc(file.name)}</span>
      <p class="mt-2 text-slate-400">${esc(e.message)}</p>`;
  }
}

function render(d, name, meta) {
  const head = d.length ? badge(OK, d.length + (d.length === 1 ? " comprobante" : " comprobantes")) : badge(NO, "No es un comprobante (ignorado)");
  const campos = (r) => [["Método", r.method], ["Operación", r.operation], ["Cód. seguridad", r.security_code], ["Fecha", r.date], ["Hora", r.time], ["Receptor", r.receiver]];
  const body = d.map((r) => `<div class="mt-3 text-2xl font-bold">${esc(r.currency)} ${Number(r.amount).toFixed(2)}</div>
      <div class="my-3 grid gap-2 grid-cols-[repeat(auto-fill,minmax(170px,1fr))]">
        ${campos(r).filter(([, v]) => v != null && v !== "").map(([k, v]) =>
          `<div class="rounded-lg border border-slate-800 bg-slate-950 px-3 py-2"><small class="block text-xs text-slate-500">${k}</small>${esc(v)}</div>`).join("")}
      </div>`).join("");
  return `<div class="flex flex-wrap items-center gap-2">${head}
      <span class="text-sm text-slate-500">${esc(name)}${meta}</span>
      <button data-copy class="rounded-md bg-slate-800 px-3 py-1 text-sm hover:bg-slate-700">Copiar JSON</button></div>
    ${body}
    <pre class="max-h-80 overflow-auto rounded-lg border border-slate-800 bg-slate-950 p-3 text-xs">${esc(JSON.stringify(d, null, 2))}</pre>`;
}
</script>
</body>
</html>
